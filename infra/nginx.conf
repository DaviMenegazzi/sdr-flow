server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location /health { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
  # Billing webhooks may carry the shared secret in the query string
  # (?webhookSecret=…); keep it out of the access log.
  location /api/webhooks/billing/ {
    access_log off;
    client_max_body_size 256k;
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /api/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  # The authenticated Inbox opens ws(s)://<current-host>/ws. In the default
  # compose topology Traefik forwards that request to this web container, so
  # Nginx must preserve the HTTP upgrade rather than serving index.html.
  location /ws {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }
  location / { try_files $uri $uri/ /index.html; }
}
